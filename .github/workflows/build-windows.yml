# Compila el instalador de Windows desde el código público y, cuando el
# proyecto esté dado de alta en SignPath, lo envía a firmar.
# Se lanza a mano (Actions > Build Windows installer > Run workflow)
# o al publicar una etiqueta tipo v1.7.18.
name: Build Windows installer

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Los dos ayudantes nativos se compilan aquí desde su código fuente
      # (native/*/*.c y *.cpp), no se usan binarios ya hechos.
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build native helpers
        shell: cmd
        run: |
          cl /nologo /O2 /EHsc /Fe:native\proc-audio\proc-audio.exe native\proc-audio\proc-audio.cpp /link ole32.lib mmdevapi.lib user32.lib
          cl /nologo /O2 /Fe:native\win-drag\win-drag.exe native\win-drag\win-drag.c /link user32.lib

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build installer
        run: pnpm make

      - name: Upload unsigned installer
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: out/make/squirrel.windows/x64/

      # Este paso solo se ejecuta cuando existe la variable
      # SIGNPATH_ORGANIZATION_ID (Settings > Secrets and variables > Actions),
      # es decir, después de que SignPath apruebe el proyecto.
      - name: Submit signing request to SignPath
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: starknet-chat-desktop
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed installer
        if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: signed-installer
          path: signed/
